name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint & Security Scan ──────────────────────────────────────────────
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Flake8 — syntax errors & undefined names
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=venv,.venv,__pycache__,.git

      - name: Flake8 — full lint (warnings only)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 \
            --statistics --exclude=venv,.venv,__pycache__,.git

      - name: Bandit — security scan
        run: |
          bandit -r app.py server.py routes/ services/ core/ utils/ \
            -x ./venv,./.venv --severity-level medium -f txt || true

  # ── Job 2: Test Suite ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7

  # ── Job 3: Docker Build ──────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aurix-ai:${{ github.sha }},aurix-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container health check
        run: |
          # Build locally (buildx above uses cache, this reuses layers)
          docker build -t aurix-ai:smoke .

          # Create a minimal .env so the container can start
          echo "MISTRAL_API_KEY=test-key" > .env.ci
          echo "FLASK_SECRET_KEY=ci-test-secret" >> .env.ci

          # Run container in background
          docker run -d --name aurix-smoke \
            --env-file .env.ci \
            -p 5000:5000 \
            aurix-ai:smoke

          # Wait for startup
          echo "Waiting for container to start..."
          sleep 10

          # Check health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health || echo "000")
          echo "Health check response: $HTTP_CODE"

          # Show logs if failed
          if [ "$HTTP_CODE" != "200" ]; then
            echo "=== Container Logs ==="
            docker logs aurix-smoke
            docker stop aurix-smoke && docker rm aurix-smoke
            exit 1
          fi

          echo "✅ Container health check passed!"
          docker stop aurix-smoke && docker rm aurix-smoke
